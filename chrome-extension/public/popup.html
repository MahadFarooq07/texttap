<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TextTap</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header class="popup-header">
      <img src="icons/48.png" width="38" height="38" alt="" />
      <div>
        <strong>TextTap</strong><span>See it. Capture it. Copy it.</span>
      </div>
      <span class="local-badge">Offline</span>
    </header>
    <main>
      <button class="capture-button" data-action="SELECT_REGION">
        <span class="action-symbol">⌗</span
        ><span
          ><strong>Select an area</strong
          ><small>Drag over the words you need</small></span
        ><kbd>Alt ⇧ S</kbd></button
      ><button class="secondary-action" data-action="CAPTURE_VISIBLE">
        <span class="action-symbol">▣</span
        ><span
          ><strong>Capture visible tab</strong
          ><small>Works where selection is blocked, too</small></span
        ></button
      ><button class="secondary-action" data-action="OPEN_EDITOR">
        <span class="action-symbol">＋</span
        ><span
          ><strong>Open an image</strong
          ><small>PNG, JPG, WebP, or BMP</small></span
        >
      </button>
      <p
        id="popup-status"
        class="popup-status"
        role="status"
        aria-live="polite"
      ></p>
    </main>
    <footer class="popup-footer">
      On-device OCR. No AI service. No account.<br />English · Classic
      non-neural recognition
    </footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
